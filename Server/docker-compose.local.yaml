name: smartender

services:
  smartender-app:
    build: .
    platform: linux/arm64
    container_name: smartender-backend-v2
    ports:
      - "17051:17051"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - APP_PORT=${APP_PORT}
      # diese Variablen werden durch env_file bereits gesetzt; hier nur zur Sicherheit:
      - DATABASE_URL=${DATABASE_URL}
      - POSTGRES_URL=${POSTGRES_URL}
    depends_on:
      smartender-db-v2:
        condition: service_healthy
    networks:
      - smartender-v2-network
    restart: unless-stopped

  smartender-db-v2:
    image: postgres:13-alpine
    platform: linux/arm64
    container_name: smartender-postgres-v2
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - smartender_v2_postgres_data:/var/lib/postgresql/data
    networks:
      - smartender-v2-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

networks:
  smartender-v2-network:
    driver: bridge

volumes:
  smartender_v2_postgres_data:
