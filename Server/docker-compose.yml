services:
  smartender-app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: smartender-backend-prod
    ports:
      - "17051:17051"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=prod
      - APP_PORT=17051
    depends_on:
      smartender-db:
        condition: service_healthy
    volumes:
      - /etc/localtime:/etc/localtime:ro
    networks:
      - smartender-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  smartender-db:
    image: postgres:15-alpine
    container_name: smartender-postgres-prod
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    ports:
      - "5432:5432"
    volumes:
      - smartender_postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - smartender-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  smartender-network:
    driver: bridge

volumes:
  smartender_postgres_data:
    driver: local
