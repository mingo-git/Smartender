version: '3.8'

# =============================================================================
# Smartender Backend V2 - PRODUCTION DEPLOYMENT
# =============================================================================

services:
  # =============================================================================
  # SMARTENDER BACKEND V2 (Production)
  # =============================================================================
  smartender-app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: smartender-backend-prod
    ports:
      - "17051:17051"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=prod
      - APP_PORT=17051
    depends_on:
      smartender-db:
        condition: service_healthy
    volumes:
      # Keine lokalen Volumes in Production (kein Hot Reload)
      - /etc/localtime:/etc/localtime:ro
    networks:
      - smartender-prod-network
    restart: unless-stopped
    labels:
      - "smartender.service=backend-production"
      - "smartender.version=2.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:17051/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =============================================================================
  # POSTGRESQL DATENBANK (Production)
  # =============================================================================
  smartender-db:
    image: postgres:15-alpine
    container_name: smartender-postgres-prod
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    ports:
      # Nur für externe Tools (optional)
      - "5432:5432"
    volumes:
      # WICHTIG: Persistente Daten
      - smartender_prod_postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - smartender-prod-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    labels:
      - "smartender.service=database-production"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  smartender-prod-network:
    driver: bridge
    name: smartender-prod-net

# =============================================================================
# VOLUMES (Persistente Daten)
# =============================================================================
volumes:
  smartender_prod_postgres_data:
    name: smartender_prod_db_data
    driver: local