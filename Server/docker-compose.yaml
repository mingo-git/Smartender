# =============================================================================
# DEVELOPMENT OVERRIDE
# =============================================================================
# Für lokale Entwicklung mit Go (nur DB in Docker):
  smartender-db-dev:
    image: postgres:13-alpine
    container_name: smartender-postgres-dev
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${APP_DB_USERNAME}
      - POSTGRES_PASSWORD=${APP_DB_PASSWORD}
      - POSTGRES_DB=${APP_DB_NAME}
    ports:
      - "5432:5432"  # Für lokale Go-Entwicklung
    volumes:
      - smartender_dev_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - smartender-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - dev  # Nur für Development starten

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  smartender-network:
    external: true
    name: server_default  # Dein bestehendes Docker-Netzwerk

# Falls das Netzwerk nicht existiert, alternative Konfiguration:
#  smartender-network:
#    driver: bridge
#    name: smartender-net

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  smartender_backup_data:
    name: smartender_backup_db
    driver: local
  smartender_dev_data:
    name: smartender_dev_db  
    driver: local

# =============================================================================
# SERVICES PROFILES
# =============================================================================
# Verschiedene Setups:
# 
# Production/Bestehende DB:
# docker-compose -f docker-compose.local.yaml up smartender-app
#
# Development (Go lokal):
# docker-compose -f docker-compose.local.yaml --profile dev up smartender-db-dev
#
# Mit Backup-DB:
# docker-compose -f docker-compose.local.yaml up smartender-app smartender-db-backup