version: '3.8'

# =============================================================================
# Smartender Backend V2 - WebSocket Upgrade
# Nutzt bestehende Infrastruktur (Port 17051)
# =============================================================================

services:
  # =============================================================================
  # OPTION 1: Bestehende Datenbank wiederverwenden (EMPFOHLEN)
  # =============================================================================
  smartender-app:
    build: .
    container_name: smartender-backend-v2
    ports:
      - "17051:17051"  # Bestehender Smartender Port
    env_file:
      - .env
    environment:
      - APP_PORT=17051
      # Verbindung zu bestehender DB
      - DB_HOST=172.20.0.3  # IP deiner bestehenden smartender-db
      - DB_PORT=5432
      - POSTGRES_USER=${APP_DB_USERNAME}
      - POSTGRES_PASSWORD=${APP_DB_PASSWORD}
      - POSTGRES_DB=${APP_DB_NAME}
    volumes:
      - ./:/app  # Für Development Hot Reload
    networks:
      - smartender-network
    restart: unless-stopped
    external_links:
      - smartender-db:postgres  # Link zu bestehender DB
    labels:
      - "smartender.service=backend-websocket"
      - "smartender.version=2.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:17051/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

