plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

/**
 * Release-Signing optional aus android/key.properties laden.
 * Beispiel-Inhalt:
 *   storeFile=smartender-keystore.jks
 *   storePassword=DEIN_STORE_PASSWORT
 *   keyAlias=smartender
 *   keyPassword=DEIN_KEY_PASSWORT
 *
 * Hinweis: storeFile ist relativ zum Modulverzeichnis (android/app).
 */
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.example.smartender_flutter_app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "25.1.8937393"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    defaultConfig {
        applicationId = "com.example.smartender_flutter_app"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            // Nur setzen, wenn key.properties vorhanden/gefüllt ist
            if (keystoreProperties.getProperty('storeFile')) {
                storeFile file(keystoreProperties.getProperty('storeFile'))
                storePassword keystoreProperties.getProperty('storePassword')
                keyAlias keystoreProperties.getProperty('keyAlias')
                keyPassword keystoreProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            // Nur signieren, wenn oben eine gültige Release-Config geladen wurde
            if (keystoreProperties.getProperty('storeFile')) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            // Standard-Debug-Keystore von Android verwenden (keine Custom-Pfade!)
            minifyEnabled false
        }
    }
}

flutter {
    source = "../.."
}
